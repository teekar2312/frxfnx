# Nginx reverse proxy configuration untuk FINEX Forex Trading Platform
# Save to: /etc/nginx/conf.d/finex-forex.conf
# Reload: nginx -t && systemctl reload nginx

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=finex_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=finex_static:10m rate=50r/s;

# Upstream untuk Next.js
upstream finex_nextjs {
  server 127.0.0.1:3000;
  keepalive 32;
}

# Upstream untuk MT5 Bridge (Socket.IO)
upstream finex_bridge {
  server 127.0.0.1:3004;
  keepalive 32;
}

# HTTP -> HTTPS redirect
server {
  listen 80;
  server_name your-domain.com www.your-domain.com;
  return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
  listen 443 ssl http2;
  server_name your-domain.com www.your-domain.com;

  # SSL certificates (Let's Encrypt atau custom)
  ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Body size limits (untuk trade journal entries dengan screenshot)
  client_max_body_size 10M;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Next.js static assets (long cache)
  location /_next/static/ {
    proxy_pass http://finex_nextjs;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    limit_req zone=finex_static burst=100 nodelay;
  }

  # API routes (no cache)
  location /api/ {
    proxy_pass http://finex_nextjs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    limit_req zone=finex_api burst=20 nodelay;
  }

  # Socket.IO — upgrade ke WebSocket
  location /socket.io/ {
    proxy_pass http://finex_bridge;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # No rate limit untuk WebSocket
  }

  # Next.js main app
  location / {
    proxy_pass http://finex_nextjs;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    limit_req zone=finex_static burst=100 nodelay;
  }

  # Health check (no cache, no rate limit)
  location = /api/health {
    proxy_pass http://finex_nextjs;
    access_log off;
  }
  location = /api/ready {
    proxy_pass http://finex_nextjs;
    access_log off;
  }
  location = /api/metrics {
    proxy_pass http://finex_nextjs;
    access_log off;
    # Restrict to internal/monitoring only
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }
}
